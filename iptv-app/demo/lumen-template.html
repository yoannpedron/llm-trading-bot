<title>LUMEN</title>
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
:root{--bg:#08080a;--bg2:#101013;--bg3:#18181d;--line:rgba(255,255,255,.09);--fg:#fafafa;--fg2:#c9c9cf;--fg3:#85858f;
  --amber:#f0b64a;--red:#e4313b;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif;--body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--pad:16px;--r:10px}
*{box-sizing:border-box}*{scrollbar-width:none}::-webkit-scrollbar{display:none}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
img{display:block;max-width:100%}
.h{font-family:var(--display)}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px var(--pad);background:linear-gradient(to bottom,rgba(8,8,10,.9),rgba(8,8,10,0));transition:background .3s}
header.solid{background:rgba(8,8,10,.92);backdrop-filter:blur(14px)}
.brand{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.14em;white-space:nowrap}
.brand i{color:var(--amber);font-style:normal;margin-right:2px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 12px;min-width:0;flex:1 1 0;max-width:300px;backdrop-filter:blur(10px)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:14px}
.search input::placeholder{color:var(--fg3)}
.search svg{flex:0 0 auto;width:15px;height:15px;stroke:var(--fg2);fill:none;stroke-width:2}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,10,13,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--fg3);font-size:10.5px;letter-spacing:.03em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--fg)}
#app{padding-bottom:84px}

/* hero */
.hero{position:relative;height:min(92vh,720px);min-height:520px;overflow:hidden;background:var(--bg2)}
.hero .layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;will-change:transform,opacity}
.hero .layer.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.hero .veil{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(8,8,10,.75) 30%,rgba(8,8,10,.15) 62%,rgba(8,8,10,.45) 100%)}
.hero .content{position:absolute;left:0;right:0;bottom:0;padding:0 var(--pad) 24px;display:flex;flex-direction:column;gap:10px}
.hero .logo{max-width:min(72vw,380px);max-height:130px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 8px 28px rgba(0,0,0,.7))}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,64px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance;text-shadow:0 6px 28px rgba(0,0,0,.8)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.chips .cert{border:1px solid rgba(255,255,255,.5);border-radius:3px;padding:0 5px;font-size:11px;font-weight:600;color:var(--fg)}
.chips .star{color:var(--amber);font-weight:600}
.chips .dot{width:3px;height:3px;border-radius:50%;background:var(--fg3)}
.chips .g{color:var(--fg3)}
.hero p{margin:0;max-width:56ch;font-size:14px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.actions{display:flex;gap:10px;align-items:center;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:8px;font-weight:600;font-size:14.5px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--fg);color:#08080a}
.btn.ghost{background:rgba(255,255,255,.16);backdrop-filter:blur(10px)}
.btn.icon{width:42px;padding:0;font-size:20px;line-height:1}
.btn.icon.on{background:var(--amber);color:#08080a}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{height:3px;width:20px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;position:relative}
.dots i.on::after{content:"";position:absolute;inset:0;background:var(--fg);transform-origin:left;animation:prog var(--dur) linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fade{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* rows */
.rows{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.row-h{display:flex;align-items:baseline;gap:10px;padding:0 var(--pad) 10px}
.row-h h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.005em}
.row-h .src{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px var(--pad) 6px;scroll-snap-type:x mandatory;scroll-padding-left:var(--pad)}
.card{flex:0 0 auto;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--bg3);position:relative;text-align:left;transition:transform .2s ease,box-shadow .2s}
.card:active{transform:scale(.97)}
.card.p{width:118px}.card.p img{width:100%;aspect-ratio:2/3;object-fit:cover}
.card.w{width:230px}.card.w .bd{width:100%;aspect-ratio:16/9;object-fit:cover}
.card.w .lg{position:absolute;left:10px;bottom:10px;max-width:55%;max-height:40%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}
.card.w .tt{position:absolute;left:10px;bottom:10px;right:10px;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.card.w::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%);pointer-events:none}
.card .badge{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--red);color:#fff}
.card .rt{position:absolute;top:8px;right:8px;z-index:2;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.6);color:var(--amber);backdrop-filter:blur(6px)}
.top{display:flex;align-items:flex-end;flex:0 0 auto;scroll-snap-align:start;gap:0}
.top .num{font-family:var(--display);font-weight:900;font-size:112px;line-height:.72;letter-spacing:-.08em;color:var(--bg);-webkit-text-stroke:2px rgba(255,255,255,.55);margin-right:-18px;z-index:1;position:relative;font-variant-numeric:tabular-nums;width:74px;text-align:right}
.top .card{width:118px}
.live{width:150px;background:var(--bg2);border:1px solid var(--line)}
.live .ic{height:78px;display:flex;align-items:center;justify-content:center;padding:12px}
.live .ic img{max-height:100%;width:auto;object-fit:contain}
.live .tt{padding:6px 10px 9px;font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line)}
.live .on-air{position:absolute;top:8px;left:8px;font-size:9px;letter-spacing:.08em;font-weight:600;color:#fff;background:var(--red);border-radius:3px;padding:1px 5px}

/* browse */
.browse{padding:70px 0 0}
.browse h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0;padding:0 var(--pad);letter-spacing:-.02em}
.browse .sub{padding:2px var(--pad) 12px;color:var(--fg3);font-size:13px;font-variant-numeric:tabular-nums}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px var(--pad) 14px}
.chip{flex:0 0 auto;height:32px;padding:0 13px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.08);color:var(--fg2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:#08080a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;padding:0 var(--pad)}
.grid .card{width:auto}
.grid.lv{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.empty{padding:50px var(--pad);color:var(--fg3);text-align:center}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden;overscroll-behavior:contain}
#sheet.open{transform:none;visibility:visible}
.sh-bd{position:relative;height:50vh;min-height:280px;overflow:hidden}
.sh-bd .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.sh-bd::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(8,8,10,.35) 55%,rgba(8,8,10,.55) 100%)}
.sh-close{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:17px}
.sh-body{position:relative;margin-top:-110px;padding:0 var(--pad) 48px;display:flex;flex-direction:column;gap:20px;z-index:2}
.sh-body .logo{max-width:min(68vw,320px);max-height:110px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 8px 28px rgba(0,0,0,.7))}
.sh-body h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,48px);line-height:.95;margin:0;letter-spacing:-.02em;text-wrap:balance}
.tagline{font-style:italic;color:var(--fg3);margin:0;font-size:14px}
.overview{margin:0;max-width:65ch;color:var(--fg2)}
.sec h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 10px}
.cast{display:flex;gap:12px;overflow-x:auto}
.cast div{flex:0 0 78px;text-align:center}
.cast .ph{width:58px;height:58px;border-radius:50%;background:var(--bg3);margin:0 auto 6px;overflow:hidden}
.cast .ph img{width:100%;height:100%;object-fit:cover}
.cast .nm{font-size:11px;font-weight:500;line-height:1.2}.cast .ch{font-size:10px;color:var(--fg3);line-height:1.2;margin-top:2px}
.sim{display:flex;gap:10px;overflow-x:auto}
.sim button{flex:0 0 84px;border-radius:6px;overflow:hidden;background:var(--bg3);text-align:left}
.sim button img{width:100%;aspect-ratio:2/3;object-fit:cover}
.sim button span{display:block;font-size:10.5px;padding:5px 6px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim button.off{opacity:.4}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-size:13px;margin:0}
.facts dt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:2px}.facts dd{margin:0}
.facts .wide{grid-column:1/-1}.facts .mono{font-family:var(--mono);font-size:11px;color:var(--fg2);word-break:break-all}
.player{aspect-ratio:16/9;background:#000;border-radius:var(--r);display:grid;place-items:center;color:var(--fg3);font-size:13px;text-align:center;padding:16px;border:1px solid var(--line);position:relative;overflow:hidden}
.player .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.player .bar i{display:block;height:100%;width:0;background:var(--red);animation:prog 30s linear forwards}
.player code{font-family:var(--mono);font-size:10px;color:var(--fg3);display:block;margin-top:8px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;background:var(--bg3);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.mylist-empty{padding:80px var(--pad);text-align:center;color:var(--fg3)}
.mylist-empty b{display:block;color:var(--fg);font-family:var(--display);font-size:22px;margin-bottom:8px}

@media (min-width:900px){
  :root{--pad:48px}
  .card.p,.top .card{width:160px}.card.w{width:300px}.live{width:190px}
  .top .num{font-size:150px;width:96px}
  .hero{height:min(88vh,820px)}.hero .content{padding-bottom:56px}.hero p{-webkit-line-clamp:3;font-size:15px}
  nav.tabs{top:0;bottom:auto;left:auto;right:48px;width:auto;grid-template-columns:repeat(5,auto);gap:2px;background:none;border:0;backdrop-filter:none;padding:10px 0}
  nav.tabs button{flex-direction:row;gap:6px;padding:7px 13px;border-radius:999px;font-size:13.5px;color:var(--fg2)}
  nav.tabs button.on{background:rgba(255,255,255,.14);color:var(--fg)}
  nav.tabs button svg{display:none}
  header .search{margin-right:540px}
  #app{padding-bottom:60px}
  .browse{padding-top:90px}
  .sh-body{margin-top:-140px;max-width:1100px}
  .facts{grid-template-columns:repeat(4,1fr)}
  .card:hover{transform:scale(1.05);box-shadow:0 12px 30px rgba(0,0,0,.6);z-index:2}
}
@media (max-width:420px){.search{max-width:190px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header id="hdr">
  <span class="brand"><i>▶</i>LUMEN</span>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Titres, acteurs, genres" autocomplete="off"></label>
</header>
<div id="app"><main id="view"></main></div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="movie"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>Films</button>
  <button data-tab="series"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Séries</button>
  <button data-tab="live"><svg viewBox="0 0 24 24"><path d="M5 9a9 9 0 0 1 14 0M8 12a5 5 0 0 1 8 0"/><circle cx="12" cy="16" r="1.5"/></svg>Live</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M5 4h14v17l-7-4-7 4z"/></svg>Ma liste</button>
</nav>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const ROWS = D.rows, HERO = D.hero;
const ALL = []; const seen = new Set();
for (const r of ROWS) for (const i of r.items) if (!seen.has(i.id)) { seen.add(i.id); ALL.push(i); }
for (const h of HERO) if (!seen.has(h.id)) { seen.add(h.id); ALL.push(h); }
const byId = new Map(ALL.map(i => [i.id, i]));
const byT = new Map(ALL.filter(i => i.tmdbId).map(i => [i.kind + ':' + i.tmdbId, i]));
const fmt = n => n >= 1000 ? Math.round(n / 1000).toLocaleString('fr-FR') + ' k' : String(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nowYear = new Date().getFullYear();
const isNew = i => i.date && (Date.now() - new Date(i.date)) < 120 * 864e5;

/* my list */
let LIST = []; try { LIST = JSON.parse(localStorage.getItem('lumen.list') || '[]'); } catch {}
const inList = id => LIST.includes(id);
function toggleList(id) { LIST = inList(id) ? LIST.filter(x => x !== id) : [...LIST, id]; try { localStorage.setItem('lumen.list', JSON.stringify(LIST)); } catch {} toast(inList(id) ? 'Ajouté à Ma liste' : 'Retiré de Ma liste'); document.querySelectorAll(`[data-list="${id}"]`).forEach(b => { b.classList.toggle('on', inList(id)); b.textContent = inList(id) ? '✓' : '+'; }); }

let tab = 'home', filterRow = null;
const view = document.getElementById('view'), tabs = document.getElementById('tabs'), hdr = document.getElementById('hdr');
addEventListener('scroll', () => hdr.classList.toggle('solid', scrollY > 40), { passive: true });
tabs.querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.tab; filterRow = null; document.getElementById('q').value = ''; render(); scrollTo({ top: 0 }); });

function chips(i, withGenres = true) {
  const p = [];
  if (i.cert) p.push(`<span class="cert">${esc(i.cert)}</span>`);
  if (i.year) p.push(`<span>${i.year}</span>`);
  if (i.runtime) p.push(`<span>${Math.floor(i.runtime / 60) ? Math.floor(i.runtime / 60) + ' h ' : ''}${i.runtime % 60 ? (i.runtime % 60) + ' min' : ''}</span>`);
  if (i.seasons) p.push(`<span>${i.seasons} saison${i.seasons > 1 ? 's' : ''}</span>`);
  if (i.rating) p.push(`<span class="star">★ ${i.rating.toFixed(1)}</span>`);
  let s = p.join('<i class="dot"></i>');
  if (withGenres && i.genres?.length) s += `<i class="dot"></i><span class="g">${esc(i.genres.slice(0, 3).join(' · '))}</span>`;
  return s;
}

/* ---- hero slideshow ---- */
let heroIdx = 0, heroTimer, stillTimer, layerOn = 0;
const SLIDE_MS = 11000, STILL_MS = 3600;
function heroHTML() {
  const i = HERO[heroIdx];
  return `<section class="hero" id="hero">
    <div class="layer" id="l0"></div><div class="layer" id="l1"></div><div class="veil"></div>
    <div class="content"><div class="fade" id="heroC">${heroContent(i)}</div>
    <div class="dots">${HERO.map((_, k) => `<i class="${k === heroIdx ? 'on' : ''}" style="--dur:${SLIDE_MS}ms"></i>`).join('')}</div></div>
  </section>`;
}
function heroContent(i) {
  return `${i.logo ? `<img class="logo" src="${i.logo}" alt="${esc(i.title)}">` : `<h1>${esc(i.title)}</h1>`}
    <div class="chips" style="margin-top:10px">${chips(i)}</div>
    ${i.overview ? `<p>${esc(i.overview)}</p>` : ''}
    <div class="actions"><button class="btn primary" data-play="${i.id}">▶ Lecture</button><button class="btn ghost" data-open="${i.id}">ⓘ Infos</button><button class="btn ghost icon${inList(i.id) ? ' on' : ''}" data-list="${i.id}" aria-label="Ma liste">${inList(i.id) ? '✓' : '+'}</button></div>`;
}
function showLayer(src) { const n = document.getElementById('l' + (layerOn ^ 1)), o = document.getElementById('l' + layerOn); if (!n) return; n.style.backgroundImage = `url("${src}")`; n.classList.add('on'); o.classList.remove('on'); layerOn ^= 1; }
function startHero() {
  stopHero(); const i = HERO[heroIdx]; if (!i) return;
  const frames = [i.backdrop, ...(i.stills || [])].filter(Boolean); let f = 0;
  showLayer(frames[0]);
  if (frames.length > 1 && !matchMedia('(prefers-reduced-motion:reduce)').matches) stillTimer = setInterval(() => { f = (f + 1) % frames.length; showLayer(frames[f]); }, STILL_MS);
  heroTimer = setTimeout(() => { heroIdx = (heroIdx + 1) % HERO.length; const h = document.getElementById('hero'); if (!h) return; document.getElementById('heroC').outerHTML = `<div class="fade" id="heroC">${heroContent(HERO[heroIdx])}</div>`; h.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === heroIdx)); startHero(); }, SLIDE_MS);
}
function stopHero() { clearTimeout(heroTimer); clearInterval(stillTimer); }
document.addEventListener('visibilitychange', () => { if (document.hidden) stopHero(); else if (tab === 'home' && document.getElementById('hero')) startHero(); });

/* ---- cards ---- */
function cardP(i) { return `<button class="card p" data-open="${i.id}" title="${esc(i.rawName)}">${isNew(i) ? '<span class="badge">NOUVEAU</span>' : ''}<img src="${i.poster}" alt="${esc(i.title)}" loading="lazy"></button>`; }
function cardW(i) { return `<button class="card w" data-open="${i.id}" title="${esc(i.rawName)}">${isNew(i) ? '<span class="badge">NOUVEAU</span>' : ''}${i.rating ? `<span class="rt">★ ${i.rating.toFixed(1)}</span>` : ''}<img class="bd" src="${i.backdrop || i.poster}" alt="" loading="lazy">${i.logo ? `<img class="lg" src="${i.logo}" alt="${esc(i.title)}">` : `<span class="tt">${esc(i.title)}</span>`}</button>`; }
function cardTop(i, n) { return `<div class="top"><span class="num">${n}</span>${cardP(i)}</div>`; }
function cardLive(i) { return `<button class="card live" data-open="${i.id}" title="${esc(i.rawName)}"><span class="on-air">DIRECT</span><div class="ic">${i.icon ? `<img src="${i.icon}" alt="" loading="lazy">` : `<span class="h" style="font-weight:800;font-size:15px;letter-spacing:.02em;text-align:center;line-height:1.15">${esc(i.title)}</span>`}</div><div class="tt">${esc(i.title)}</div></button>`; }
function rowHTML(r, k) {
  if (!r.items.length) return '';
  const wide = r.type === 'row' && k < 3 && r.kind === 'movie';
  const src = r.kind === 'live' ? 'Serveur' : 'TMDB';
  const body = r.type === 'top10' ? r.items.map((i, n) => cardTop(i, n + 1)).join('') : r.kind === 'live' ? r.items.map(cardLive).join('') : wide ? r.items.map(cardW).join('') : r.items.map(cardP).join('');
  return `<section class="row"><div class="row-h"><h2 class="h">${esc(r.name)}</h2><span class="src">${src}</span></div><div class="strip">${body}</div></section>`;
}

/* ---- render ---- */
function render() {
  stopHero();
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q.length >= 2) {
    const hits = ALL.filter(i => [i.title, i.original, i.rawName, ...(i.genres || []), ...(i.cast || []).map(c => c.name), i.director].filter(Boolean).join(' ').toLowerCase().includes(q));
    const g = [['movie', 'Films'], ['series', 'Séries'], ['live', 'Chaînes']].map(([k, n]) => ({ kind: k, type: 'row', name: n, items: hits.filter(i => i.kind === k) })).filter(r => r.items.length);
    view.innerHTML = `<section class="browse"><h1 class="h">« ${esc(q)} »</h1><div class="sub">${hits.length} résultat${hits.length > 1 ? 's' : ''}</div></section><div class="rows">${g.map((r) => rowHTML(r, 9)).join('') || '<p class="empty">Aucun résultat.</p>'}</div>`;
    return;
  }
  if (tab === 'home') {
    view.innerHTML = heroHTML() + `<div class="rows">${ROWS.map(rowHTML).join('')}</div>`;
    startHero(); return;
  }
  if (tab === 'list') {
    const items = LIST.map(id => byId.get(id)).filter(Boolean);
    view.innerHTML = `<section class="browse"><h1 class="h">Ma liste</h1><div class="sub">${items.length} titre${items.length > 1 ? 's' : ''} · enregistrés sur cet appareil</div>${items.length ? `<div class="grid">${items.map(i => i.kind === 'live' ? cardLive(i) : cardP(i)).join('')}</div>` : `<div class="mylist-empty"><b>Rien pour l'instant</b>Appuie sur + sur un film ou une série pour le retrouver ici.</div>`}</section>`;
    return;
  }
  const rows = ROWS.filter(r => r.kind === tab);
  const label = { movie: 'Films', series: 'Séries', live: 'Live TV' }[tab];
  const cur = filterRow ? rows.filter(r => r.name === filterRow) : rows;
  const items = []; const s = new Set();
  for (const r of cur) for (const i of r.items) if (!s.has(i.id)) { s.add(i.id); items.push(i); }
  view.innerHTML = `<section class="browse"><h1 class="h">${label}</h1><div class="sub">${items.length} titres dans cette démo · ${fmt(D.counts[tab])} sur le serveur</div>
    <div class="chipbar"><button class="chip${!filterRow ? ' on' : ''}" data-cat="">Tout</button>${rows.map(r => `<button class="chip${filterRow === r.name ? ' on' : ''}" data-cat="${esc(r.name)}">${esc(r.name.replace(/ cette semaine| de tous les temps| cinéma| en ce moment/g, ''))}</button>`).join('')}</div>
    <div class="grid${tab === 'live' ? ' lv' : ''}">${items.map(i => tab === 'live' ? cardLive(i) : cardP(i)).join('')}</div></section>`;
}

/* ---- details ---- */
const sheet = document.getElementById('sheet');
function openSheet(id, playing) {
  const i = byId.get(id); if (!i) return; stopHero();
  const live = i.kind === 'live';
  const sid = i.id.split(':')[1];
  const url = live ? `http://mag.marsweb.co/live/5e43d416a4/•••/${sid}.m3u8` : i.kind === 'series' ? `http://mag.marsweb.co/series/5e43d416a4/•••/{episode}.mp4` : `http://mag.marsweb.co/movie/5e43d416a4/•••/${sid}.mp4`;
  const facts = live ? [['Nom brut Xtream', i.rawName]] : [['Titre original', i.original !== i.title ? i.original : null], ['Réalisateur', i.director], ['Créateurs', i.creators?.join(', ')], ['Genres', i.genres?.join(', ')], ['Sortie', i.date], ['Note TMDB', i.rating ? `${i.rating.toFixed(1)} / 10 · ${i.votes.toLocaleString('fr-FR')} votes` : null], ['Statut', i.status], ['Épisodes', i.episodes], ['Version du flux', i.lang]].filter(([, v]) => v);
  const player = `<div class="player"><div>${live ? 'Flux HLS en direct' : 'Fichier vidéo'} du serveur de test : image noire, lecture désactivée dans cette démo hébergée. Dans l'application, ce bouton lance le flux.<code>${esc(url)}</code></div><div class="bar"><i></i></div></div>`;
  sheet.innerHTML = `
    <div class="sh-bd"><div class="bg" style="background-image:url('${i.backdrop || i.poster || i.icon}')"></div><button class="sh-close" data-close aria-label="Fermer">✕</button></div>
    <div class="sh-body">
      ${i.logo ? `<img class="logo" src="${i.logo}" alt="${esc(i.title)}">` : `<h1 class="h">${esc(i.title)}</h1>`}
      ${live ? '' : `<div class="chips">${chips(i)}</div>`}
      ${i.tagline ? `<p class="tagline">${esc(i.tagline)}</p>` : ''}
      ${i.overview ? `<p class="overview">${esc(i.overview)}</p>` : ''}
      <div class="actions"><button class="btn primary" data-play="${i.id}">▶ Lecture</button>${i.trailer ? `<a class="btn ghost" href="https://www.youtube.com/watch?v=${i.trailer}" target="_blank" rel="noreferrer">Bande-annonce</a>` : ''}${live ? '' : `<button class="btn ghost icon${inList(i.id) ? ' on' : ''}" data-list="${i.id}" aria-label="Ma liste">${inList(i.id) ? '✓' : '+'}</button>`}</div>
      <div id="pslot">${playing ? player : ''}</div>
      ${i.cast?.length ? `<div class="sec"><h3 class="h">Casting</h3><div class="cast">${i.cast.map(c => `<div><div class="ph">${c.photo ? `<img src="${c.photo}" alt="">` : ''}</div><div class="nm">${esc(c.name)}</div><div class="ch">${esc(c.character)}</div></div>`).join('')}</div></div>` : ''}
      ${i.similar?.length ? `<div class="sec"><h3 class="h">${i.kind === 'series' ? 'Séries similaires' : 'Titres similaires'}</h3><div class="sim">${i.similar.map(s => { const loc = byT.get(i.kind + ':' + s.tmdbId); return `<button class="${loc ? '' : 'off'}" ${loc ? `data-open="${loc.id}"` : ''} title="${loc ? esc(s.title) : 'Absent de cette démo'}"><img src="${s.poster}" alt=""><span>${esc(s.title)}</span></button>`; }).join('')}</div></div>` : ''}
      <div class="sec"><h3 class="h">Fiche</h3><dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}${live ? '' : `<div class="wide"><dt>Nom brut Xtream</dt><dd class="mono">${esc(i.rawName)}</dd></div>`}</dl></div>
    </div>`;
  sheet._player = player;
  sheet.classList.add('open'); sheet.scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeSheet() { sheet.classList.remove('open'); document.body.style.overflow = ''; if (tab === 'home' && document.getElementById('hero')) startHero(); }
function play(id) { if (!sheet.classList.contains('open') || !sheet.querySelector(`[data-play="${id}"]`)) openSheet(id, true); const s = document.getElementById('pslot'); if (s && !s.innerHTML) s.innerHTML = sheet._player; s?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-play],[data-close],[data-cat],[data-list]'); if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.hasAttribute('data-list')) return toggleList(t.dataset.list);
  if (t.hasAttribute('data-play')) return play(t.dataset.play);
  if (t.hasAttribute('data-cat')) { filterRow = t.dataset.cat || null; render(); return; }
  if (t.hasAttribute('data-open')) return openSheet(t.dataset.open);
});
document.getElementById('q').addEventListener('input', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
render();
})();
</script>
