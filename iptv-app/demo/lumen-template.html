<title>LUMEN</title>
<meta name="theme-color" content="#0a0b10">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#0a0b10;--bg2:#12141c;--bg3:#1b1e29;--line:#262a38;
  --fg:#f2f0eb;--fg2:#b7bac6;--fg3:#7c8090;
  --amber:#e8b04b;--amber2:#f4cd80;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:16px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
img{display:block;max-width:100%}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

/* ---- backdrop ---- */
#bd{position:fixed;inset:0;z-index:0;background:var(--bg);overflow:hidden}
#bd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease,transform 6s ease;transform:scale(1.04)}
#bd img.on{opacity:1;transform:scale(1)}
#bd::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to top,var(--bg) 0%,rgba(10,11,16,.85) 35%,rgba(10,11,16,.25) 70%,rgba(10,11,16,.55) 100%)}

/* ---- app shell ---- */
#app{position:relative;z-index:1;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px var(--pad);
  background:linear-gradient(to bottom,rgba(10,11,16,.92),rgba(10,11,16,0))}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.08em;white-space:nowrap;flex:0 0 auto}
.brand b{color:var(--amber)}
.search{margin-left:auto;flex:1 1 0;min-width:0;max-width:280px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;backdrop-filter:blur(10px)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:14px}
.search input::placeholder{color:var(--fg3)}
.demo-pill{flex:0 0 auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(232,176,75,.4);border-radius:999px;padding:3px 8px;white-space:nowrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(12,13,20,.88);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--fg3);font-size:11px;letter-spacing:.04em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--amber)}
nav.tabs button small{font-size:10px;color:var(--fg3)}

/* ---- hero ---- */
.hero{min-height:52vh;display:flex;flex-direction:column;justify-content:flex-end;padding:18vh var(--pad) 20px;gap:10px}
.hero .logo{max-width:min(70vw,360px);max-height:120px;object-fit:contain;object-position:left;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7))}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,56px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.8)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.meta .star{color:var(--amber)}
.genres{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.hero p{margin:0;max-width:60ch;font-size:14px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px}
.btn.primary{background:var(--fg);color:#0a0b10}
.btn.ghost{background:rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.fade{animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- rows ---- */
.row{padding:8px 0 4px}
.row-h{display:flex;align-items:baseline;gap:10px;padding:0 var(--pad) 8px}
.row-h h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0}
.row-h .lang{font-size:10px;letter-spacing:.08em;color:var(--amber);border:1px solid rgba(232,176,75,.35);border-radius:4px;padding:1px 5px}
.row-h .n{font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px var(--pad) 10px;scroll-snap-type:x mandatory;scroll-padding-left:var(--pad)}
.card{flex:0 0 auto;width:118px;scroll-snap-align:start;border-radius:8px;overflow:hidden;background:var(--bg3);position:relative;transition:transform .2s ease}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover}
.card.on{outline:2px solid var(--amber);outline-offset:2px}
.card .t{position:absolute;inset:auto 0 0 0;padding:20px 8px 6px;font-size:11px;font-weight:500;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.live{width:150px;background:var(--bg2);border:1px solid var(--line)}
.card.live .ic{height:84px;display:flex;align-items:center;justify-content:center;padding:12px}
.card.live .ic img{max-height:100%;width:auto;aspect-ratio:auto;object-fit:contain}
.card.live .t{position:static;background:none;padding:6px 8px 8px;color:var(--fg2)}
.card.live .q{position:absolute;top:6px;right:6px;font-size:9px;letter-spacing:.06em;color:var(--fg3);background:rgba(0,0,0,.5);border-radius:3px;padding:1px 4px}

/* ---- browse ---- */
.browse{padding:12px 0}
.browse .title{font-family:var(--display);font-weight:800;font-size:28px;margin:0;padding:0 var(--pad)}
.browse .sub{padding:2px var(--pad) 10px;color:var(--fg3);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--pad) 12px}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.07);color:var(--fg2);white-space:nowrap}
.chip.on{background:var(--amber);color:#0a0b10;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;padding:0 var(--pad)}
.grid.live{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid .card{width:auto}
.empty{padding:40px var(--pad);color:var(--fg3);text-align:center}

/* ---- details sheet ---- */
#sheet{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#sheet.open{transform:none;visibility:visible}
.sh-bd{position:relative;height:46vh;min-height:260px}
.sh-bd img{width:100%;height:100%;object-fit:cover}
.sh-bd::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(10,11,16,.2) 60%,rgba(10,11,16,.5) 100%)}
.sh-close{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:18px}
.sh-body{position:relative;margin-top:-90px;padding:0 var(--pad) 40px;display:flex;flex-direction:column;gap:18px}
.sh-body .logo{max-width:min(70vw,320px);max-height:100px;object-fit:contain;object-position:left;filter:drop-shadow(0 6px 24px rgba(0,0,0,.7))}
.sh-body h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,44px);line-height:1;margin:0;text-wrap:balance}
.tagline{font-style:italic;color:var(--fg3);margin:0;font-size:14px}
.overview{margin:0;max-width:65ch;color:var(--fg2)}
.section h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 10px}
.cast{display:flex;gap:12px;overflow-x:auto}
.cast div{flex:0 0 76px;text-align:center}
.cast .ph{width:56px;height:56px;border-radius:50%;background:var(--bg3);margin:0 auto 6px;overflow:hidden}
.cast .ph img{width:100%;height:100%;object-fit:cover}
.cast .nm{font-size:11px;font-weight:500;line-height:1.2}
.cast .ch{font-size:10px;color:var(--fg3);line-height:1.2;margin-top:2px}
.sim{display:flex;gap:10px;overflow-x:auto}
.sim button{flex:0 0 80px;border-radius:6px;overflow:hidden;background:var(--bg3);text-align:left}
.sim button img{width:100%;aspect-ratio:2/3;object-fit:cover}
.sim button span{display:block;font-size:10px;padding:4px 6px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sim button.off{opacity:.45}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-size:13px}
.facts dt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:2px}
.facts dd{margin:0}
.facts dd.mono{font-family:var(--mono);font-size:11px;color:var(--fg2);word-break:break-all}
.facts .wide{grid-column:1/-1}
.player{aspect-ratio:16/9;background:#000;border-radius:10px;display:grid;place-items:center;color:var(--fg3);font-size:13px;text-align:center;padding:16px;border:1px solid var(--line)}
.player code{font-family:var(--mono);font-size:10px;color:var(--fg3);display:block;margin-top:8px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:50;background:var(--bg3);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media (min-width:900px){
  :root{--pad:40px}
  .card{width:150px}.card.live{width:190px}
  .hero{min-height:62vh}
  nav.tabs{top:0;bottom:auto;left:auto;right:40px;width:auto;grid-template-columns:repeat(4,auto);gap:4px;background:none;border:0;backdrop-filter:none;padding:14px 0}
  nav.tabs button{flex-direction:row;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px}
  nav.tabs button.on{background:var(--fg);color:#0a0b10}
  nav.tabs button svg{display:none}
  header .search{margin-right:420px}
  #app{padding-bottom:40px}
  .sh-body{margin-top:-120px}
  .facts{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:420px){.demo-pill{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="bd"><img id="bd0" alt=""><img id="bd1" alt=""></div>
<div id="app">
  <header>
    <span class="brand"><b>▶</b> LUMEN</span>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Rechercher un titre" autocomplete="off"></label>
    <span class="demo-pill">Démo</span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="movie"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>Films</button>
  <button data-tab="series"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Séries</button>
  <button data-tab="live"><svg viewBox="0 0 24 24"><path d="M5 9a9 9 0 0 1 14 0M8 12a5 5 0 0 1 8 0"/><circle cx="12" cy="16" r="1.5"/></svg>Live</button>
</nav>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('data').textContent);
const ROWS = DATA.rows;
const ALL = ROWS.flatMap(r => r.items.map(i => ({ ...i, kind: r.kind, cat: r.name, catLang: r.lang })));
const byId = new Map(ALL.map(i => [i.id, i]));
const byTmdb = new Map(ALL.filter(i => i.tmdbId).map(i => [i.tmdbId, i]));
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + ' k' : String(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---- backdrop crossfade (two layers) ---- */
let bdLayer = 0, bdCur = '';
function setBackdrop(src) {
  if (!src || src === bdCur) return;
  bdCur = src;
  const next = document.getElementById('bd' + (bdLayer ^ 1)), prev = document.getElementById('bd' + bdLayer);
  next.src = src; next.classList.add('on'); prev.classList.remove('on'); bdLayer ^= 1;
}

/* ---- state ---- */
let tab = 'home', focused = null, filterCat = null;
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
tabs.querySelectorAll('button').forEach(b => {
  const k = b.dataset.tab, n = { movie: DATA.counts.movie, series: DATA.counts.series, live: DATA.counts.live }[k];
  if (n) b.insertAdjacentHTML('beforeend', `<small>${fmt(n)}</small>`);
  b.onclick = () => { tab = k; filterCat = null; render(); window.scrollTo({ top: 0 }); };
});

function metaOf(i) {
  const parts = [];
  if (i.year) parts.push(i.year);
  if (i.runtime) parts.push(i.runtime + ' min');
  if (i.seasons) parts.push(i.seasons + (i.seasons > 1 ? ' saisons' : ' saison'));
  if (i.rating) parts.push(`<span class="star">★</span> ${i.rating.toFixed(1)}`);
  if (i.lang) parts.push(i.lang);
  if (i.quality) parts.push(i.quality);
  return parts.map(p => `<span>${p}</span>`).join('');
}

function heroHTML(i) {
  if (!i) return '';
  return `<section class="hero"><div class="fade" key="${i.id}">
    ${i.logo ? `<img class="logo" src="${i.logo}" alt="${esc(i.title)}">` : `<h1>${esc(i.title)}</h1>`}
    <div class="meta" style="margin-top:10px">${metaOf(i)}</div>
    ${i.genres?.length ? `<div class="genres" style="margin-top:4px">${esc(i.genres.slice(0, 4).join(' · '))}</div>` : ''}
    ${i.overview ? `<p style="margin-top:8px">${esc(i.overview)}</p>` : ''}
    <div class="actions"><button class="btn primary" data-play="${i.id}">▶ Lecture</button><button class="btn ghost" data-open="${i.id}">Plus d'infos</button></div>
  </div></section>`;
}

function cardHTML(i, kind) {
  if (kind === 'live') return `<button class="card live" data-open="${i.id}" title="${esc(i.rawName)}">
    <div class="ic">${i.icon ? `<img src="${i.icon}" alt="" loading="lazy">` : `<span style="font-size:12px;color:var(--fg3)">${esc(i.title)}</span>`}</div>
    ${i.quality ? `<span class="q">${esc(i.quality)}</span>` : ''}<div class="t">${esc(i.title)}</div></button>`;
  return `<button class="card${focused === i.id ? ' on' : ''}" data-focus="${i.id}" data-open="${i.id}" title="${esc(i.rawName)}">
    <img src="${i.poster}" alt="" loading="lazy"><div class="t">${esc(i.title)}</div></button>`;
}

function rowHTML(r) {
  return `<section class="row"><div class="row-h"><h2>${esc(r.name)}</h2>${r.lang ? `<span class="lang">${esc(r.lang)}</span>` : ''}<span class="n">${r.items.length}</span></div>
    <div class="strip">${r.items.map(i => cardHTML(i, r.kind)).join('')}</div></section>`;
}

function render() {
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q.length >= 2) {
    const hits = ALL.filter(i => (i.title + ' ' + i.rawName).toLowerCase().includes(q));
    const groups = ['movie', 'series', 'live'].map(k => ({ kind: k, name: { movie: 'Films', series: 'Séries', live: 'Chaînes' }[k], items: hits.filter(i => i.kind === k) })).filter(g => g.items.length);
    focused = hits.find(h => h.kind !== 'live')?.id ?? focused;
    view.innerHTML = `<section class="browse"><h1 class="title">« ${esc(q)} »</h1><div class="sub">${hits.length} résultat${hits.length > 1 ? 's' : ''} dans l'échantillon</div></section>` + (groups.length ? groups.map(rowHTML).join('') : `<p class="empty">Aucun résultat.</p>`);
  } else if (tab === 'home') {
    const f = byId.get(focused) || ROWS[0].items[0];
    focused = f.id; setBackdrop(f.backdrop || f.poster);
    view.innerHTML = heroHTML(f) + ROWS.map(rowHTML).join('');
  } else {
    const rows = ROWS.filter(r => r.kind === tab);
    const label = { movie: 'Films', series: 'Séries', live: 'Live TV' }[tab];
    const total = DATA.counts[tab];
    const cur = filterCat ? rows.filter(r => r.name === filterCat) : rows;
    const items = cur.flatMap(r => r.items.map(i => ({ ...i, kind: r.kind })));
    const f = tab !== 'live' ? (byId.get(focused)?.kind === tab ? byId.get(focused) : items[0]) : null;
    if (f) { focused = f.id; setBackdrop(f.backdrop); } else setBackdrop(null);
    view.innerHTML = `<section class="browse">
      ${f ? `<div class="hero" style="min-height:34vh;padding-top:8vh"><div class="fade">${f.logo ? `<img class="logo" src="${f.logo}" alt="${esc(f.title)}" style="max-height:80px">` : `<h1>${esc(f.title)}</h1>`}<div class="meta" style="margin-top:8px">${metaOf(f)}</div></div></div>` : ''}
      <h1 class="title">${label}</h1>
      <div class="sub">${items.length} titres affichés · ${fmt(total)} dans le catalogue complet du serveur</div>
      <div class="chips"><button class="chip${!filterCat ? ' on' : ''}" data-cat="">Tout</button>${rows.map(r => `<button class="chip${filterCat === r.name ? ' on' : ''}" data-cat="${esc(r.name)}">${r.lang ? r.lang + ' · ' : ''}${esc(r.name)} <span style="opacity:.6">${r.items.length}</span></button>`).join('')}</div>
      <div class="grid${tab === 'live' ? ' live' : ''}">${items.map(i => cardHTML(i, tab)).join('')}</div>
    </section>`;
  }
}

/* ---- details sheet ---- */
const sheet = document.getElementById('sheet');
function openSheet(id) {
  const i = byId.get(id); if (!i) return;
  const isLive = i.kind === 'live';
  const facts = [
    ['Titre original', i.original !== i.title ? i.original : null], ['Réalisateur', i.director], ['Créateurs', i.creators?.join(', ')],
    ['Genres', i.genres?.join(', ')], ['Année', i.year], ['Note TMDB', i.rating ? `${i.rating.toFixed(1)} / 10 · ${i.votes} votes` : null],
    ['Statut', i.status], ['Épisodes', i.episodes], ['Langue du flux', i.lang], ['Qualité', i.quality], ['Catégorie', (i.catLang ? i.catLang + ' · ' : '') + i.cat],
    ['Tags extraits', i.tags?.join(', ')],
  ].filter(([, v]) => v);
  const url = isLive ? `http://mag.marsweb.co/live/5e43d416a4/•••/${i.id.split(':')[1]}.m3u8` : i.kind === 'series' ? `http://mag.marsweb.co/series/5e43d416a4/•••/{episode_id}.mp4` : `http://mag.marsweb.co/movie/5e43d416a4/•••/${i.id.split(':')[1]}.mp4`;
  sheet.innerHTML = `
    <div class="sh-bd">${i.backdrop ? `<img src="${i.backdrop}" alt="">` : ''}<button class="sh-close" data-close aria-label="Fermer">✕</button></div>
    <div class="sh-body">
      ${i.logo ? `<img class="logo" src="${i.logo}" alt="${esc(i.title)}">` : `<h1>${esc(i.title)}</h1>`}
      ${i.tagline ? `<p class="tagline">${esc(i.tagline)}</p>` : ''}
      <div class="meta">${metaOf(i)}</div>
      ${i.overview ? `<p class="overview">${esc(i.overview)}</p>` : ''}
      <div class="actions"><button class="btn primary" data-play="${i.id}">▶ Lecture</button>${i.trailer ? `<a class="btn ghost" href="https://www.youtube.com/watch?v=${i.trailer}" target="_blank" rel="noreferrer">Bande-annonce</a>` : ''}</div>
      <div id="player-slot"></div>
      ${i.cast?.length ? `<div class="section"><h3>Casting</h3><div class="cast">${i.cast.map(c => `<div><div class="ph">${c.photo ? `<img src="${c.photo}" alt="">` : ''}</div><div class="nm">${esc(c.name)}</div><div class="ch">${esc(c.character)}</div></div>`).join('')}</div></div>` : ''}
      ${i.similar?.length ? `<div class="section"><h3>${i.kind === 'series' ? 'Séries similaires' : 'Films similaires'}</h3><div class="sim">${i.similar.map(s => { const loc = byTmdb.get(s.tmdbId); return `<button class="${loc ? '' : 'off'}" ${loc ? `data-open="${loc.id}"` : ''} title="${loc ? '' : 'Absent de cet échantillon'}"><img src="${s.poster}" alt=""><span>${esc(s.title)}${s.year ? ` (${s.year})` : ''}</span></button>`; }).join('')}</div></div>` : ''}
      <div class="section"><h3>Fiche</h3><dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}<div class="wide"><dt>Nom brut Xtream</dt><dd class="mono">${esc(i.rawName)}</dd></div></div></div>
    </div>`;
  sheet.dataset.url = url;
  sheet.classList.add('open'); sheet.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if (i.backdrop) setBackdrop(i.backdrop);
}
function closeSheet() { sheet.classList.remove('open'); document.body.style.overflow = ''; }
function play(id) {
  const i = byId.get(id); openSheet(id);
  const slot = document.getElementById('player-slot');
  slot.innerHTML = `<div class="player"><div>${i.kind === 'live' ? 'Flux HLS' : 'Fichier'} du serveur de test : contenu noir, lecture désactivée dans cette démo hébergée.<code>${esc(sheet.dataset.url)}</code></div></div>`;
  slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---- events (delegated) ---- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-play],[data-close],[data-cat],[data-focus]');
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.hasAttribute('data-play')) return play(t.dataset.play);
  if (t.hasAttribute('data-cat')) { filterCat = t.dataset.cat || null; focused = null; render(); return; }
  if (t.hasAttribute('data-open')) return openSheet(t.dataset.open);
});
// hover / focus on desktop swaps the hero without opening
let hoverT;
document.addEventListener('pointerover', e => {
  const c = e.target.closest('[data-focus]'); if (!c || e.pointerType === 'touch') return;
  clearTimeout(hoverT); hoverT = setTimeout(() => focusItem(c.dataset.focus), 250);
});
function focusItem(id) {
  if (focused === id) return;
  const i = byId.get(id); if (!i) return;
  focused = id;
  document.querySelectorAll('.card.on').forEach(c => c.classList.remove('on'));
  document.querySelectorAll(`[data-focus="${id}"]`).forEach(c => c.classList.add('on'));
  const hero = view.querySelector('.hero');
  if (hero) { const tmp = document.createElement('div'); tmp.innerHTML = tab === 'home' ? heroHTML(i) : `<div class="hero" style="min-height:34vh;padding-top:8vh"><div class="fade">${i.logo ? `<img class="logo" src="${i.logo}" alt="${esc(i.title)}" style="max-height:80px">` : `<h1>${esc(i.title)}</h1>`}<div class="meta" style="margin-top:8px">${metaOf(i)}</div></div></div>`; hero.replaceWith(tmp.firstElementChild); }
  setBackdrop(i.backdrop || i.poster);
}
document.getElementById('q').addEventListener('input', () => render());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

render();
})();
</script>
